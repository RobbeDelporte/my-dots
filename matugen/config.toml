# Tokens verified against matugen 4.1.0. Token form: {{colors.<role>.default.hex}} /
# {{colors.<role>.default.hex_stripped}} (no leading #). Role names: Material You snake_case.
# Note: ANSI 16 (terminal_color_N) are a static Catppuccin Mocha palette in the templates
# because matugen 4.x has no terminal_color_N roles.

[config]
# matugen 4.x aborts the ENTIRE render (exit 1, writes nothing) when an image
# yields multiple candidate source colors AND no TTY is present to prompt — which
# is exactly how wayle invokes matugen on every wallpaper change. With no
# preference set, every themed app silently freezes at the last good palette.
# `prefer` picks a source color non-interactively (CLI `--prefer` equivalent) so
# headless renders always succeed. "saturation" = most-saturated candidate (vivid
# accent). Alternatives: darkness, lightness, less-saturation, value,
# closest-to-fallback.
prefer = "saturation"

# NOTE: ~/.config/hypr is a whole-dir symlink to the repo, so matugen must NOT
# write inside it (it would clobber the tracked static fallback hypr/colors.conf).
# Generated colors go to ~/my-dots/generated/; hyprland.conf sources the static
# fallback first, then this override.
[templates.hypr-colors]
input_path  = "~/.config/matugen/templates/hypr-colors.tmpl"
output_path = "~/my-dots/generated/hypr-colors.conf"
# `hyprctl reload` prints "ok" to stdout. wayle self-themes by running matugen
# with `--json` and capturing stdout as its palette; an unredirected post_hook
# appends "ok" after the JSON, so wayle fails with "cannot parse palette JSON"
# and silently falls back to its static palette (bar stops tracking the wallpaper).
# Redirect both streams so post_hook output never pollutes matugen's --json capture.
post_hook   = "hyprctl reload >/dev/null 2>&1"

[templates.kitty]
input_path  = "~/.config/matugen/templates/kitty.tmpl"
output_path = "~/my-dots/generated/kitty.conf"
# Output goes to ~/my-dots/generated/ (same gitignored sink as hyprland/hyprlock
# colors), NOT kitty's config dir — kitty.conf includes it by absolute path.
# kitty re-reads kitty.conf (and
# its includes) on SIGUSR1, re-applying colors to every open window. wayle runs
# this post_hook on every matugen render — wallpaper set AND scheme change — so
# the terminal tracks the palette live. Redirect all output: wayle captures
# matugen --json on stdout and an unredirected post_hook corrupts that capture.
# `|| true` so a render with no kitty running never fails the pipeline.
post_hook   = "pkill -USR1 kitty >/dev/null 2>&1 || true"

[templates.rofi]
input_path  = "~/.config/matugen/templates/rofi.tmpl"
output_path = "~/my-dots/generated/rofi-colors.rasi"
# No post_hook: rofi is launched on demand and reads its theme fresh every time,
# so there is no running instance to signal (unlike kitty's SIGUSR1 reload).

[templates.hyprlock]
input_path  = "~/.config/matugen/templates/hyprlock.tmpl"
output_path = "~/my-dots/generated/hyprlock-colors.conf"

[templates.yazi]
input_path  = "~/.config/matugen/templates/yazi.tmpl"
output_path = "~/.config/yazi/theme.toml"

[templates.swayimg]
input_path  = "~/.config/matugen/templates/swayimg-colors.tmpl"
output_path = "~/my-dots/generated/swayimg-colors.lua"
# Colours ONLY. ~/.config/swayimg is a whole-dir symlink to the repo, so matugen
# must NOT write inside it (would clobber the tracked init.lua). Output goes to the
# generated/ sink and swayimg/init.lua dofile's it — same include pattern as
# kitty/rofi/hypr. No post_hook: swayimg reads config fresh on each launch.

[templates.niri]
input_path  = "~/.config/matugen/templates/niri-colors.tmpl"
output_path = "~/my-dots/generated/niri-colors.kdl"
# No post_hook: ~/.config/niri is a whole-dir symlink to the repo, so matugen must
# NOT write inside it (would clobber tracked config.kdl) — output goes to the
# generated/ sink and config.kdl `include`s it by absolute path. niri live-reloads
# watched includes, so the running session re-themes with no signal needed.

[templates.nvim]
input_path  = "~/.config/matugen/templates/nvim.tmpl"
output_path = "~/my-dots/generated/nvim-colors.lua"
# No post_hook: nvim reads this palette at startup (on-next-launch). nvim has no
# live-reload signal like kitty's SIGUSR1, and any unredirected post_hook stdout
# would corrupt wayle's `matugen --json` palette capture — so none is set.
# ~/.config/nvim is a whole-dir symlink to the repo, so output goes to the
# generated/ sink (NOT inside nvim/) and user/configs/catppuccin.lua dofile's it.

# Desktop wallpaper clock (eww). Colours only → generated/ sink; eww.scss
# @imports it by absolute path (~/.config/eww is a whole-dir symlink to the repo,
# so matugen must NOT write inside it — same anti-clobber rule as kitty/niri).
# post_hook: reposition.sh --reload applies the new colours AND the per-wallpaper
# position in a SINGLE open animation (it closes the clock, reloads styles while
# nothing is mapped, then opens once). This is the ONE trigger for every theme
# render -- wallpaper set or scheme change, GUI or rofi picker -- so the picker
# no longer calls reposition.sh itself (that double-triggered, causing two fades).
# Output redirected so it never pollutes wayle's `matugen --json` palette capture;
# `|| true` so a render with eww absent/not-running never fails the pipeline.
[templates.eww]
input_path  = "~/.config/matugen/templates/eww-colors.tmpl"
output_path = "~/my-dots/generated/eww-colors.scss"
post_hook   = "~/.config/eww/reposition.sh --reload >/dev/null 2>&1 || true"

# GTK3 + GTK4: one template (gtk-colors.tmpl) drives BOTH color namespaces —
# libadwaita names for GTK4 apps and stock-Adwaita @theme_* names for GTK3, so
# no theme package (e.g. adw-gtk3) is required. One template per file, duplicated
# across both toolkit dirs since matugen maps one template to one output.
# ~/.config/gtk-{3.0,4.0} are REAL dirs (created manually); only `bookmarks`
# there is user data. GTK reads these at app startup — apps re-theme on relaunch.
[templates.gtk3]
input_path  = "~/.config/matugen/templates/gtk-colors.tmpl"
output_path = "~/.config/gtk-3.0/gtk.css"

[templates.gtk4]
input_path  = "~/.config/matugen/templates/gtk-colors.tmpl"
output_path = "~/.config/gtk-4.0/gtk.css"
