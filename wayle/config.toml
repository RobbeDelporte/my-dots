# wayle 0.6.0 config — overrides merged over `wayle config default`.
# Full schema: `wayle config default --stdout` / `wayle config schema --stdout`.
#
# SOURCE OF TRUTH: this file. It is tracked in my-dots (wayle/config.toml) and
# symlinked to ~/.config/wayle/config.toml. wayle layers config as
#     defaults  ->  config.toml (this file)  ->  runtime.toml (GUI scratch)
# The wayle-settings GUI and `wayle config set` write ~/.config/wayle/runtime.toml,
# which OVERRIDES this file at runtime. Treat the GUI as an editing surface — when you
# change something there and want to keep it, fold the value into this file and clear it
# from runtime.toml (`wayle config reset <path>`) so this stays authoritative.

[general]
font-sans = "Rubik"
font-mono = "CaskaydiaCove Nerd Font"

[styling]
theme-provider = "matugen"   # self-theme from the wallpaper (default is "wayle" — do not drop)
matugen-scheme = "tonal-spot"
matugen-light = false

[bar]
scale = 0.8
button-variant = "basic"

# Providing bar.layout replaces the default layout array. Bar shows only on the laptop
# panel; HDMI-A-1 and DP-1 are hidden (show = false).
[[bar.layout]]
monitor = "*"
show = true
left = ["dashboard", "hyprland-workspaces"]
center = ["clock", "notifications", "media"]
right = [{ name = "group", modules = ["cpu", "ram"] }, "volume", "network", "bluetooth", "battery"]

[[bar.layout]]
monitor = "HDMI-A-1"
show = false
left = ["media"]
center = ["clock"]
right = ["battery", "bluetooth", "network", "microphone", "volume"]

[[bar.layout]]
monitor = "DP-1"
show = false
left = ["media"]
center = ["clock"]
right = ["battery", "bluetooth", "network", "microphone", "volume"]

[modules.hyprland-workspaces]
monitor-specific = false
show-special = false
app-icons-show = true

[modules.clock]
format = "%a %b %d %H:%M"

[modules.storage]
mount-point = "/home"

[wallpaper]
transition-type = "none"
transition-duration = 0.1
