# yazi core config. Tracked in ~/my-dots/yazi/; ~/.config/yazi is a manual
# whole-dir symlink to this repo dir (see README). Keep this lean and let
# yazi's built-in defaults handle anything we don't explicitly override.

[mgr]
show_hidden = false
sort_by     = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode    = "size"
show_symlink = true

[preview]
max_width  = 600
max_height = 900
cache_dir  = ""
image_filter = "triangle"
image_quality = 75

# Opener `run` strings take yazi's own placeholders, not shell positionals:
# %s = all paths, %sN = Nth path, %dN = dirname of the Nth. Since yazi 26
# a legacy "$@" expands to nothing and the opener runs with no arguments.
[opener]
edit = [
    { run = 'nvim %s', desc = "Open in Neovim", block = true, for = "linux" },
]
open = [
    { run = 'xdg-open %s1', desc = "Open with xdg-open", for = "linux" },
]
reveal = [
    { run = 'xdg-open %d1', desc = "Reveal in xdg-open", for = "linux" },
]
glow = [
    { run = 'glow -p %s', desc = "Preview with glow", block = true, for = "linux" },
]

[open]
prepend_rules = [
    { url = "*.md",   use = "glow" },
    { url = "*.txt",  use = "edit" },
    { url = "*.json", use = "edit" },
    { url = "*.toml", use = "edit" },
    { url = "*.yaml", use = "edit" },
    { url = "*.yml",  use = "edit" },
    { url = "*.conf", use = "edit" },
    { url = "*.lua",  use = "edit" },
    { url = "*.py",   use = "edit" },
    { url = "*.sh",   use = "edit" },
    { mime = "text/*", use = "edit" },
]

[tasks]
micro_workers    = 10
macro_workers    = 10
bizarre_retry    = 3
image_alloc      = 536870912
image_bound      = [0, 0]
suppress_preload = false
