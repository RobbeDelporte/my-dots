# kitty config — ~/.config/kitty is a manual symlink to this repo dir (see README).
# matugen writes the generated colors to ~/my-dots/generated/ (gitignored),
# NOT into this config dir — see the include at the bottom. Only this file is tracked.

shell zsh
font_family           JetBrains Mono Nerd Font
font_size             12.0
cursor_shape          beam
cursor_beam_thickness 1.5
scrollback_lines      10000
window_padding_width  10
background_opacity    0.95

# Static fallback palette
background #0b0f11
foreground #dfe6ed
color0  #151a1e
color1  #f28b82
color2  #81c995
color3  #fdd663
color4  #8ab4f8
color5  #cf86e8
color6  #78d9ec
color7  #c4cdd4
color8  #3c4a50
color9  #f6aea9
color10 #a8d5b5
color11 #fde78b
color12 #a8c7fa
color13 #ddb6f2
color14 #a4eaf5
color15 #dfe6ed

# matugen-generated colors
include ${HOME}/my-dots/generated/kitty.conf
