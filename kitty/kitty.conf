# kitty config — symlinked to ~/.config/kitty/kitty.conf by scripts/install.sh.
# matugen writes the generated colors to the shared ~/.local/state/wayle/ dir
# (same place hyprland/hyprlock colors go), NOT into this config dir — see the
# include at the bottom. Only this file is tracked.

shell zsh
font_family           JetBrains Mono Nerd Font
font_size             12.0
cursor_shape          beam
cursor_beam_thickness 1.5
scrollback_lines      10000
window_padding_width  10
# (foot's bold-text-in-bright=no has no kitty key — kitty's default already
# renders bold via a bold font, not the bright color, so nothing to set.)
# Hyprland forces kitty opaque via a window rule (hypr/hyprland/rules.conf),
# matching foot's previous effective behavior — so no compositor transparency.
background_opacity    0.95
# kitty ships shell integration (OSC 133 prompt marks etc.) enabled by default.

# Static fallback palette — used as-is before the first matugen run, when the
# included colors file is absent (kitty logs a warning and keeps these). The
# include below is processed inline and overrides these once the file exists.
# Ported from the old foot.ini fallback.
background #0b0f11
foreground #dfe6ed
color0  #151a1e
color1  #f28b82
color2  #81c995
color3  #fdd663
color4  #8ab4f8
color5  #cf86e8
color6  #78d9ec
color7  #c4cdd4
color8  #3c4a50
color9  #f6aea9
color10 #a8d5b5
color11 #fde78b
color12 #a8c7fa
color13 #ddb6f2
color14 #a4eaf5
color15 #dfe6ed

# matugen-generated colors (shared state dir) override the fallback above.
# Absolute ${HOME} path — kitty expands env vars in include, so it resolves
# regardless of kitty.conf being a symlink into the repo. kitty re-reads this on
# SIGUSR1 (see matugen [templates.kitty] post_hook).
include ${HOME}/.local/state/wayle/kitty.conf
