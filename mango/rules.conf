# Ported from hypr/hyprland/rules.conf. mango matches `appid` (not `class`), and
# has no `center`/`pin`/`opaque` fields: floating windows are centred natively,
# and opacity is global (focused_opacity=1.0), so the opacity rules are moot.

# Named scratchpads -- these replace Hyprland's special workspaces. The appid must
# match the toggle_named_scratchpad binds in keybinds.conf exactly.
windowrule=isnamedscratchpad:1,width:1280,height:800,appid:yazi
windowrule=isnamedscratchpad:1,width:1280,height:800,appid:slack
windowrule=isnamedscratchpad:1,width:1280,height:800,appid:spotify-qt
windowrule=isnamedscratchpad:1,width:1100,height:700,appid:btop

# Portals
windowrule=isfloating:1,width:1000,height:700,appid:xdg-desktop-portal-(gtk|gnome|kde|hyprland)

# GNOME Files (Nautilus)
windowrule=isfloating:1,width:1200,height:800,appid:org\.gnome\.Nautilus

# Anki popup
windowrule=isfloating:1,width:620,height:540,appid:anki-popup

# Float-only
windowrule=isfloating:1,appid:guifetch
windowrule=isfloating:1,appid:yad
windowrule=isfloating:1,appid:zenity
windowrule=isfloating:1,appid:wev
windowrule=isfloating:1,appid:org\.gnome\.FileRoller
windowrule=isfloating:1,appid:file-roller
windowrule=isfloating:1,appid:blueman-manager
windowrule=isfloating:1,appid:feh
windowrule=isfloating:1,appid:swayimg
windowrule=isfloating:1,appid:com\.gabm\.satty
windowrule=isfloating:1,appid:system-config-printer

# Float + size
windowrule=isfloating:1,width:1152,height:756,appid:kitty,title:nmtui
windowrule=isfloating:1,width:1344,height:864,appid:org\.gnome\.Settings
windowrule=isfloating:1,width:1152,height:756,appid:org\.pulseaudio\.pavucontrol
windowrule=isfloating:1,width:1152,height:756,appid:yad-icon-browser
windowrule=isfloating:1,width:960,height:648,appid:nwg-look

# Dialogs
windowrule=isfloating:1,title:(Select|Open)( a)? (File|Folder)(s)?
windowrule=isfloating:1,title:File (Operation|Upload)( Progress)?
windowrule=isfloating:1,title:.* Properties
windowrule=isfloating:1,title:Save As
windowrule=isfloating:1,title:Library

# Picture in picture
windowrule=isfloating:1,width:480,height:270,title:Picture(-| )in(-| )[Pp]icture

# Ueberzugpp previews (yazi)
windowrule=isfloating:1,isopensilent:1,appid:^(ueberzugpp_.*)$

# Games -- allow tearing, no blur/shadow overhead
windowrule=noblur:1,isnoshadow:1,force_tearing:1,appid:(steam_app_(default|[0-9]+))|gamescope
windowrule=isfloating:1,appid:steam,title:Friends List

# Minecraft launcher consoles
windowrule=isfloating:1,appid:com-atlauncher-App,title:ATLauncher Console
windowrule=isfloating:1,appid:PandoraLauncher,title:Minecraft Game Output

# Layer rules -- ported from the layerrule block. rofi zooms in/out; selection
# surfaces (slurp) and hyprpicker get no animation or blur.
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi
layerrule=noanim:1,noblur:1,layer_name:selection
layerrule=noanim:1,noblur:1,layer_name:hyprpicker
layerrule=animation_type_open:zoom,layer_name:gtk-layer-shell
