# Ported from hypr/hyprland/monitors.conf. mango has no `preferred`/`auto`
# keywords, so mode and position are explicit. x offsets assume eDP-1 sits at
# x:0 with a logical width of 1600 (1920 / 1.2 scale).
monitorrule=name:^eDP-1$,width:1920,height:1080,refresh:60,x:0,y:0,scale:1.2,rr:0,vrr:0
monitorrule=name:^DP-1$,width:3440,height:1440,refresh:59.97,x:1600,y:0,scale:1,rr:0,vrr:0
monitorrule=name:^HDMI-A-1$,width:1920,height:1080,refresh:60,x:1600,y:0,scale:1,rr:0,vrr:0
# Catch-all for the 2560x1440@74.78 external in the Hyprland config's blank-name rule.
monitorrule=name:.*,width:2560,height:1440,refresh:74.78,x:1600,y:0,scale:1,rr:0,vrr:0
