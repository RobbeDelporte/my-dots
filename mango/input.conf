# Ported from hypr/hyprland/input.conf.
repeat_rate=35
repeat_delay=250
numlockon=0
xkb_rules_layout=us

# Trackpad. NB: mango applies these at startup only -- re-login after a change.
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# Mouse. Hyprland ran sensitivity=-0.35 with accel_profile=flat, plus a per-device
# block for the touchpad; mango exposes neither, so pointer speed is left to
# libinput defaults until it can be tuned from inside a session.
mouse_natural_scrolling=0
