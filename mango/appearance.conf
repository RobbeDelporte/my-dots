# Ported from hypr/hyprland/variables.conf + the general/decoration blocks.
# Colours live in colors.conf / generated/mango-colors.conf, never here.

# Window effects (scenefx). Hyprland: blur size 8, 2 passes, shadows off.
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=8
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2

shadows=0
layer_shadows=0
shadow_only_floating=1
shadows_size=10
shadows_blur=20
shadows_position_x=0
shadows_position_y=0

border_radius=6
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Gaps: $windowGapsIn=2 / $windowGapsOut=4.
gappih=2
gappiv=2
gappoh=4
gappov=4
smartgaps=0
borderpx=1

# Animations. Hyprland's curves are per-event beziers; mango takes one curve per
# event, so these are close equivalents rather than exact ports.
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.5
zoom_end_ratio=0.9
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=350
animation_duration_open=300
animation_duration_tag=300
animation_duration_close=350
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1

# Layout. Hyprland used dwindle with preserve_split + smart_resizing.
tag_num=9
new_is_master=1
default_mfact=0.55
default_nmaster=1
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=1

# Scratchpad geometry (the named scratchpads in rules.conf).
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9

# Overview (mango-only feature; hot corner off, as Hyprland had none).
hotarea_size=10
enable_hotarea=0
ov_tab_mode=1
overviewgappi=5
overviewgappo=30

# Misc. focus_on_activate + sloppyfocus mirror Hyprland's focus_on_activate=true
# and follow_mouse=2.
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=1
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# Per-tag layout. dwindle everywhere, matching Hyprland's single global layout.
tagrule=id:1,layout_name:dwindle
tagrule=id:2,layout_name:dwindle
tagrule=id:3,layout_name:dwindle
tagrule=id:4,layout_name:dwindle
tagrule=id:5,layout_name:dwindle
tagrule=id:6,layout_name:dwindle
tagrule=id:7,layout_name:dwindle
tagrule=id:8,layout_name:dwindle
tagrule=id:9,layout_name:dwindle
