# Ported from hypr/hyprland/execs.conf.

# uwsm has no native mango support: without `finalize`, WAYLAND_DISPLAY never
# reaches the systemd user session and every `uwsm app --`/`app2unit` launch below
# (and the Super+T terminal bind) fails. This MUST stay first.
exec-once=uwsm finalize

# Cursor. Hyprland used `hyprctl setcursor`; mango has no equivalent dispatcher, so
# the theme comes from the environment (cursor_size is set in appearance.conf).
env=XCURSOR_THEME,sweet-cursors
env=XCURSOR_SIZE,24
env=QT_QPA_PLATFORMTHEME,qtengine
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env=QT_AUTO_SCREEN_SCALE_FACTOR,1
env=GDK_BACKEND,wayland,x11
env=QT_QPA_PLATFORM,wayland;xcb
env=SDL_VIDEODRIVER,wayland,x11,windows
env=CLUTTER_BACKEND,wayland
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=_JAVA_AWT_WM_NONREPARENTING,1

# Shell: bar, notifications, wallpaper (awww) and the matugen self-theming chain.
# NB: wayle's `hyprland-workspaces` module is Hyprland-only, so the left cluster of
# the bar has a dead spot here. Everything else in it is compositor-agnostic.
exec-once=uwsm app -- wayle shell

# Clipboard history watchers
exec-once=wl-paste --type text --watch cliphist store
exec-once=wl-paste --type image --watch cliphist store

# ydotool daemon (the alternate-paste bind)
exec-once=uwsm app -- ydotoold

# Keyring and auth
exec-once=gnome-keyring-daemon --start --components=secrets
exec-once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Auto delete trash 30 days old
exec-once=trash-empty 30

# Cursor theme for GTK apps
exec-once=gsettings set org.gnome.desktop.interface cursor-theme 'sweet-cursors'
exec-once=gsettings set org.gnome.desktop.interface cursor-size 24

# Location provider and night light
exec-once=/usr/lib/geoclue-2.0/demos/agent
exec-once=sh -c 'sleep 1 && gammastep'

# Forward bluetooth media commands to MPRIS
exec-once=mpris-proxy

# The eww wallpaper clock stays disabled here, as it is on Hyprland.
