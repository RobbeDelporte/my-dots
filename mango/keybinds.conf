# Mirror of hypr/hyprland/keybinds.conf, using mango dispatchers. Differences from
# Hyprland are commented where they exist. Two scripts are reused straight from
# the Hyprland tree because they are compositor-agnostic (awww + hyprlock, and
# rofi + wayle): ~/.config/hypr/scripts/{lock,wallpicker}.sh.

# -- Launcher --
bind=SUPER,space,spawn,sh -c 'pkill -x rofi || rofi -show drun'
# Hyprland's Super+Tab ran a rofi window switcher built on hyprctl; mango has a
# native window-cycling dispatcher, so no script is needed.
bind=SUPER,Tab,focusstack,next
bind=SUPER+SHIFT,w,spawn,~/.config/hypr/scripts/wallpicker.sh

# -- Session / shell control --
bindr=CTRL+SUPER+SHIFT,r,spawn,wayle panel restart
bind=SUPER+SHIFT,r,reload_config
bind=CTRL+ALT,Delete,quit

# -- Brightness --
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl set 5%+
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-

# -- Media --
bindl=CTRL+SUPER,space,spawn,playerctl --player=spotifyd play-pause
bindl=NONE,XF86AudioPlay,spawn,playerctl --player=spotifyd play-pause
bindl=NONE,XF86AudioPause,spawn,playerctl --player=spotifyd play-pause
bindl=CTRL+SUPER,equal,spawn,playerctl --player=spotifyd next
bindl=NONE,XF86AudioNext,spawn,playerctl --player=spotifyd next
bindl=CTRL+SUPER,minus,spawn,playerctl --player=spotifyd previous
bindl=NONE,XF86AudioPrev,spawn,playerctl --player=spotifyd previous
bindl=NONE,XF86AudioStop,spawn,playerctl --player=spotifyd stop

# -- Volume / mic --
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=SUPER+SHIFT,m,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioRaiseVolume,spawn,sh -c 'wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 10%+'
bindl=NONE,XF86AudioLowerVolume,spawn,sh -c 'wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%-'

# -- Tags (Hyprland workspaces 1-9; mango has 9 tags, so Super+0 is dropped) --
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=CTRL+SUPER,right,viewtoright,0
bind=CTRL+SUPER,left,viewtoleft,0
bind=SUPER,Next,viewtoright,0
bind=SUPER,Prior,viewtoleft,0
axisbind=SUPER,DOWN,viewtoright_have_client
axisbind=SUPER,UP,viewtoleft_have_client

# -- Move window to tag --
bind=SUPER+ALT,1,tag,1,0
bind=SUPER+ALT,2,tag,2,0
bind=SUPER+ALT,3,tag,3,0
bind=SUPER+ALT,4,tag,4,0
bind=SUPER+ALT,5,tag,5,0
bind=SUPER+ALT,6,tag,6,0
bind=SUPER+ALT,7,tag,7,0
bind=SUPER+ALT,8,tag,8,0
bind=SUPER+ALT,9,tag,9,0
bind=CTRL+SUPER+SHIFT,right,tagtoright,0
bind=CTRL+SUPER+SHIFT,left,tagtoleft,0

# -- Focus / move --
bind=SUPER,left,focusdir,left
bind=SUPER,right,focusdir,right
bind=SUPER,up,focusdir,up
bind=SUPER,down,focusdir,down
bind=SUPER+SHIFT,left,exchange_client,left
bind=SUPER+SHIFT,right,exchange_client,right
bind=SUPER+SHIFT,up,exchange_client,up
bind=SUPER+SHIFT,down,exchange_client,down

# -- Resize (Hyprland: resizeactive in 10% steps) --
bind=SUPER,minus,resizewin,-50,+0
bind=SUPER,equal,resizewin,+50,+0
bind=SUPER+SHIFT,minus,resizewin,+0,-50
bind=SUPER+SHIFT,equal,resizewin,+0,+50
bind=SUPER+ALT,left,resizewin,-50,+0
bind=SUPER+ALT,right,resizewin,+50,+0
bind=SUPER+ALT,up,resizewin,+0,-50
bind=SUPER+ALT,down,resizewin,+0,+50

# -- Window state --
bind=SUPER,q,killclient,
bind=SUPER,f,togglefullscreen,
bind=SUPER+ALT,f,togglemaximizescreen,
bind=SUPER+ALT,space,togglefloating,
bind=CTRL+SUPER,backslash,centerwin,
bind=SUPER,p,toggleoverlay,
bind=SUPER,n,switch_layout
bind=SUPER,i,minimized,
bind=SUPER+SHIFT,i,restore_minimized

# -- Monitors --
bind=SUPER+SHIFT+ALT,left,focusmon,left
bind=SUPER+SHIFT+ALT,right,focusmon,right
bind=SUPER+CTRL+ALT,left,tagmon,left
bind=SUPER+CTRL+ALT,right,tagmon,right

# -- Scratchpads (Hyprland special workspaces, via wstoggle.sh) --
bind=SUPER,e,toggle_named_scratchpad,yazi,none,kitty --class yazi --title yazi yazi
bind=SUPER,d,toggle_named_scratchpad,slack,none,slack
bind=SUPER,m,toggle_named_scratchpad,spotify-qt,none,spotify-qt
bind=CTRL+SHIFT,Escape,toggle_named_scratchpad,btop,none,kitty --class btop --title btop btop
bind=SUPER,s,toggle_scratchpad,

# -- Lock --
bind=SUPER,Escape,spawn,~/.config/hypr/scripts/lock.sh
bind=SUPER,l,spawn,~/.config/hypr/scripts/lock.sh
bindl=SUPER+SHIFT,l,spawn,systemctl suspend-then-hibernate

# -- Apps --
bind=SUPER,t,spawn,app2unit -- kitty

# -- Screenshots / recording (mango-local: grimblast requires hyprctl) --
bindl=NONE,Print,spawn,~/.config/mango/scripts/screenshot.sh screen
bind=SUPER+SHIFT,s,spawn,~/.config/mango/scripts/screenshot.sh region
bind=SUPER+SHIFT+ALT,s,spawn,~/.config/mango/scripts/screenshot.sh window
bind=CTRL+ALT,r,spawn,~/.config/mango/scripts/record.sh
bind=SUPER+ALT,r,spawn,~/.config/mango/scripts/record.sh -s
bind=SUPER+SHIFT+ALT,r,spawn,~/.config/mango/scripts/record.sh -r
bind=SUPER+SHIFT,c,spawn,hyprpicker -a

# -- Clipboard & emoji --
bind=SUPER,v,spawn,sh -c 'pkill -x rofi || cliphist list | rofi -dmenu | cliphist decode | wl-copy'
bind=SUPER,period,spawn,sh -c "pkill -x rofi || BEMOJI_PICKER_CMD='rofi -dmenu' bemoji"
bindl=CTRL+SHIFT+ALT,v,spawn,sh -c 'sleep 0.5s && ydotool type -d 1 "$(cliphist list | head -1 | cliphist decode)"'

# -- Mouse --
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Dropped, no mango equivalent: window groups (togglegroup, changegroupactive,
# lockactivegroup, moveoutofgroup), pin, and the touchpad `gesture =` lines.
