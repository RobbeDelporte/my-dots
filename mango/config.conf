# Entry point. Order matters: static colors, then the matugen override, then the
# rest. `source-optional` is used for the generated file so a fresh checkout (or a
# machine that has never rendered a palette) starts without a parse error.
source=~/.config/mango/colors.conf
source-optional=~/my-dots/generated/mango-colors.conf

source=~/.config/mango/appearance.conf
source=~/.config/mango/input.conf
source=~/.config/mango/monitors.conf
source=~/.config/mango/rules.conf
source=~/.config/mango/keybinds.conf
source=~/.config/mango/execs.conf
