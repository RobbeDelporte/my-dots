# Self-contained Hyprland config oder matters: colors and
# variables are sourced before files that reference $color / $kb* vars.
source = ~/.config/hypr/colors.conf                  # tracked static fallback
source = ~/my-dots/generated/hypr-colors.conf        # matugen override (in gitignored generated/; absent until first render — harmless missing-source warning)
source = ~/.config/hypr/hyprland/variables.conf
source = ~/.config/hypr/hyprland/monitors.conf

# General / decoration / layout — uses the $gaps/$blur/$rounding vars above.
general {
    layout = dwindle

    allow_tearing = false  # Allows `immediate` window rule to work

    gaps_workspaces = $workspaceGaps
    gaps_in = $windowGapsIn
    gaps_out = $windowGapsOut
    border_size = $windowBorderSize

    col.active_border = $activeWindowBorderColour
    col.inactive_border = $inactiveWindowBorderColour
}

dwindle {
    preserve_split = true
    smart_split = false
    smart_resizing = true
}

decoration {
    rounding = $windowRounding
    active_opacity = $windowOpacity
    inactive_opacity = $windowOpacity

    blur {
        enabled = $blurEnabled
        xray = $blurXray
        special = $blurSpecialWs
        ignore_opacity = true  # Allows opacity blurring
        new_optimizations = true
        popups = $blurPopups
        input_methods = $blurInputMethods
        size = $blurSize
        passes = $blurPasses
    }

    shadow {
        enabled = $shadowEnabled
        range = $shadowRange
        render_power = $shadowRenderPower
        color = $shadowColour
    }
}

misc {
    vrr = 1

    animate_manual_resizes = false
    animate_mouse_windowdragging = false

    disable_hyprland_logo = true
    force_default_wallpaper = 0

    on_focus_under_fullscreen = 2
    allow_session_lock_restore = true
    middle_click_paste = false
    focus_on_activate = true
    session_lock_xray = true

    mouse_move_enables_dpms = true
    key_press_enables_dpms = true

    background_color = rgb($surfaceContainer)
}

group {
    col.border_active = $activeWindowBorderColour
    col.border_inactive = $inactiveWindowBorderColour
    col.border_locked_active = $activeWindowBorderColour
    col.border_locked_inactive = $inactiveWindowBorderColour

    groupbar {
        font_family = JetBrains Mono NF
        font_size = 15
        gradients = true
        gradient_round_only_edges = false
        gradient_rounding = 5
        height = 25
        indicator_height = 0
        gaps_in = 3
        gaps_out = 3

        text_color = rgb($onPrimary)
        col.active = rgba($primaryd4)
        col.inactive = rgba($outlineVariantd4)
        col.locked_active = rgba($primaryd4)
        col.locked_inactive = rgba($secondaryd4)
    }
}

debug {
    error_position = 1
}

workspace = special:special, gapsout:$workspaceGaps

# Environment variables
env = QT_QPA_PLATFORMTHEME, qtengine
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
env = QT_AUTO_SCREEN_SCALE_FACTOR, 1
env = XCURSOR_THEME, $cursorTheme
env = XCURSOR_SIZE, $cursorSize
env = HYPRCURSOR_THEME, $cursorTheme
env = HYPRCURSOR_SIZE, $cursorSize
env = GDK_BACKEND, wayland,x11
env = QT_QPA_PLATFORM, wayland;xcb
env = SDL_VIDEODRIVER, wayland,x11,windows
env = CLUTTER_BACKEND, wayland
env = ELECTRON_OZONE_PLATFORM_HINT, auto
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland
env = _JAVA_AWT_WM_NONREPARENTING, 1

source = ~/.config/hypr/hyprland/input.conf
source = ~/.config/hypr/hyprland/animations.conf
source = ~/.config/hypr/hyprland/rules.conf
source = ~/.config/hypr/hyprland/keybinds.conf
source = ~/.config/hypr/hyprland/special.conf
source = ~/.config/hypr/hyprland/execs.conf
