$wstoggle = ~/.config/hypr/scripts/wstoggle.sh
# files (user override): yazi in kitty, Super+E
bind = Super, E, exec, $wstoggle files yazi kitty --class yazi --title yazi yazi
# communication: slack, Super+D
bind = Super, D, exec, $wstoggle communication slack slack
# music: spotify-qt, Super+M
bind = Super, M, exec, $wstoggle music spotify-qt spotify-qt
# sysmon: btop in kitty, Ctrl+Shift+Escape
bind = Ctrl+Shift, Escape, exec, $wstoggle sysmon btop kitty --class btop --title btop btop
# generic scratch toggle, Super+S
bind = $kbToggleSpecialWs, togglespecialworkspace, special
