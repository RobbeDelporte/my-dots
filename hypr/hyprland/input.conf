input {
    kb_layout = us
    numlock_by_default = false
    repeat_delay = 250
    repeat_rate = 35

    focus_on_close = 1

    sensitivity = -0.35
    accel_profile = flat
    force_no_accel = false
    follow_mouse = 2

    touchpad {
        natural_scroll = true
        disable_while_typing = $touchpadDisableTyping
        scroll_factor = $touchpadScrollFactor
        sensitivity = -0.1
        accel_profile = adaptive
    }
}

binds {
    scroll_event_delay = 0
}

cursor {
    hotspot_padding = 1
}

gestures {
    # NB: Hyprland 0.55 dropped `workspace_swipe`/`workspace_swipe_fingers` from
    # this block — the swipe is bound via the `gesture =` line below. Only the
    # swipe TUNING options remain valid here.
    workspace_swipe_distance = 700
    workspace_swipe_cancel_ratio = 0.15
    workspace_swipe_min_speed_to_force = 5
    workspace_swipe_direction_lock = true
    workspace_swipe_direction_lock_threshold = 10
    workspace_swipe_create_new = true
}

gesture = $workspaceSwipeFingers, horizontal, workspace
gesture = $gestureFingers, up, special, special
gesture = $gestureFingers, down, dispatcher, exec, hyprctl dispatch togglespecialworkspace special
gesture = $gestureFingersMore, down, dispatcher, exec, systemctl suspend-then-hibernate
