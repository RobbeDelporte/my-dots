# ── Launcher ──
bind = Super, Space, exec, pkill -x rofi || rofi -show drun
bind = Super, Tab, exec, ~/.config/hypr/scripts/window-switcher.sh   # window switcher (hyprctl + rofi)
bind = Super+Shift, W, exec, ~/.config/hypr/scripts/wallpicker.sh   # wallpaper picker (rofi + thumbnails)

# ── Session / shell control ──
bindr = Ctrl+Super+Shift, R, exec, wayle panel restart

# ── Brightness ──
bindle = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindle = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# ── Media ──
bindl = Ctrl+Super, Space, exec, playerctl --player=spotifyd play-pause
bindl = , XF86AudioPlay, exec, playerctl --player=spotifyd play-pause
bindl = , XF86AudioPause, exec, playerctl --player=spotifyd play-pause
bindl = Ctrl+Super, Equal, exec, playerctl --player=spotifyd next
bindl = , XF86AudioNext, exec, playerctl --player=spotifyd next
bindl = Ctrl+Super, Minus, exec, playerctl --player=spotifyd previous
bindl = , XF86AudioPrev, exec, playerctl --player=spotifyd previous
bindl = , XF86AudioStop, exec, playerctl --player=spotifyd stop

# ── Go to workspace #   (via ws.sh: collapses any open special workspace first)
$ws = exec, ~/.config/hypr/scripts/ws.sh
bind = $kbGoToWs, 1, $ws 1
bind = $kbGoToWs, 2, $ws 2
bind = $kbGoToWs, 3, $ws 3
bind = $kbGoToWs, 4, $ws 4
bind = $kbGoToWs, 5, $ws 5
bind = $kbGoToWs, 6, $ws 6
bind = $kbGoToWs, 7, $ws 7
bind = $kbGoToWs, 8, $ws 8
bind = $kbGoToWs, 9, $ws 9
bind = $kbGoToWs, 0, $ws 10
bind = Super, mouse_down, $ws e-1
bind = Super, mouse_up, $ws e+1
binde = $kbPrevWs, $ws e-1
binde = $kbNextWs, $ws e+1
binde = Super, Page_Up , $ws e-1
binde = Super, Page_Down, $ws e+1

# ── Move window to workspace # ──
bind = $kbMoveWinToWs, 1, movetoworkspace, 1
bind = $kbMoveWinToWs, 2, movetoworkspace, 2
bind = $kbMoveWinToWs, 3, movetoworkspace, 3
bind = $kbMoveWinToWs, 4, movetoworkspace, 4
bind = $kbMoveWinToWs, 5, movetoworkspace, 5
bind = $kbMoveWinToWs, 6, movetoworkspace, 6
bind = $kbMoveWinToWs, 7, movetoworkspace, 7
bind = $kbMoveWinToWs, 8, movetoworkspace, 8
bind = $kbMoveWinToWs, 9, movetoworkspace, 9
bind = $kbMoveWinToWs, 0, movetoworkspace, 10
binde = Super+Alt, Page_Up, movetoworkspace, -1
binde = Super+Alt, Page_Down, movetoworkspace, +1
bind = Super+Alt, mouse_down, movetoworkspace, -1
bind = Super+Alt, mouse_up, movetoworkspace, +1
binde = Ctrl+Super+Shift, right, movetoworkspace, +1
binde = Ctrl+Super+Shift, left, movetoworkspace, -1
bind = Ctrl+Super+Shift, up, movetoworkspace, special:special
bind = Ctrl+Super+Shift, down, movetoworkspace, e+0
bind = Super+Alt, S, movetoworkspace, special:special

# ── Window groups ──
binde = $kbWindowGroupCycleNext, cyclenext
binde = $kbWindowGroupCyclePrev, cyclenext, prev
binde = Ctrl+Alt, Tab, changegroupactive, f
binde = Ctrl+Shift+Alt, Tab, changegroupactive, b
bind = $kbToggleGroup, togglegroup
bind = $kbUngroup, moveoutofgroup
bind = Super+Shift, Comma, lockactivegroup, toggle

# ── Window actions ──
bind = Super, left, movefocus, l
bind = Super, right, movefocus, r
bind = Super, up, movefocus, u
bind = Super, down, movefocus, d
bind = Super+Shift, left, movewindow, l
bind = Super+Shift, right, movewindow, r
bind = Super+Shift, up, movewindow, u
bind = Super+Shift, down, movewindow, d
binde = Super, Minus, resizeactive, -10% 0
binde = Super, Equal, resizeactive, 10% 0
binde = Super+Shift, Minus, resizeactive, 0 -10%
binde = Super+Shift, Equal, resizeactive, 0 10%
binde = Super+Alt, left, resizeactive, -10% 0
binde = Super+Alt, right, resizeactive, 10% 0
binde = Super+Alt, up, resizeactive, 0 -10%
binde = Super+Alt, down, resizeactive, 0 10%
bindm = Super, mouse:272, movewindow
bindm = $kbMoveWindow, movewindow
bindm = Super, mouse:273, resizewindow
bindm = $kbResizeWindow, resizewindow
bind = Ctrl+Super, Backslash, centerwindow, 1
bind = Ctrl+Super+Alt, Backslash, resizeactive, exact 55% 70%
bind = Ctrl+Super+Alt, Backslash, centerwindow, 1
bind = $kbPinWindow, pin
bind = $kbWindowFullscreen, fullscreen, 0
bind = $kbWindowBorderedFullscreen, fullscreen, 1
bind = $kbToggleWindowFloating, togglefloating,
bind = $kbCloseWindow, killactive,

# ── Lock (hyprlock; hypridle removed → exec the launcher directly) ──
bind = Super, Escape, exec, ~/.config/hypr/scripts/lock.sh
bind = Super, L, exec, ~/.config/hypr/scripts/lock.sh

# ── Apps ──
bind = $kbTerminal, exec, app2unit -- $terminal

# ── Utilities ──
bindl = , Print, exec, ~/.config/hypr/scripts/screenshot.sh screen
bind = Super+Shift, S, exec, ~/.config/hypr/scripts/screenshot.sh region
bind = Super+Shift+Alt, S, exec, ~/.config/hypr/scripts/screenshot.sh window
bind = Super+Alt, R, exec, ~/.config/hypr/scripts/record.sh -s
bind = Ctrl+Alt, R, exec, ~/.config/hypr/scripts/record.sh
bind = Super+Shift+Alt, R, exec, ~/.config/hypr/scripts/record.sh -r
bind = Super+Shift, C, exec, hyprpicker -a

# ── Volume / mic ──
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = Super+Shift, M, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindle = , XF86AudioRaiseVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ $volumeStep%+
bindle = , XF86AudioLowerVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume @DEFAULT_AUDIO_SINK@ $volumeStep%-

# ── Sleep ──
bindl = Super+Shift, L, exec, systemctl suspend-then-hibernate

# ── Clipboard & emoji ──
bind = Super, V, exec, pkill -x rofi || cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind = Super, Period, exec, pkill -x rofi || BEMOJI_PICKER_CMD='rofi -dmenu' bemoji
bindl = Ctrl+Shift+Alt, V, exec, sleep 0.5s && ydotool type -d 1 "$(cliphist list | head -1 | cliphist decode)"
