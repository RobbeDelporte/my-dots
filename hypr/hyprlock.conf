# Layout adapted from catppuccin/hyprlock, themed from matugen (wallpaper-derived)
# colors instead of a static Catppuccin flavour.
#
# Static fallbacks below only apply before the first setwall.sh run: the matugen
# file redefines the colors per wallpaper and setwall.sh writes $wallpaper.
$accent     = rgb(a6cbe6)
$accentHex  = a6cbe6
$surface    = rgb(141a1d)
$surfaceA   = rgba(141a1dcc)   # frosted input fill (alpha cc ≈ 80%)
$onSurface  = rgb(dfe6ed)
$background = rgb(0b0f11)
$error      = rgb(ffb4ab)
$tertiary   = rgb(e6c2a6)
$outline    = rgb(8a939b)
$wallpaper  = screenshot
$font       = CaskaydiaCove Nerd Font

source = ~/.local/state/wayle/hyprlock-colors.conf
source = ~/.local/state/wayle/hyprlock-wallpaper.conf

general {
    hide_cursor = true
    ignore_empty_input = true   # don't auth on a blank password
}

# Password-only (PAM). No fingerprint block — fprintd isn't installed.

# Current wallpaper, blurred at lock time. Darkened a touch so the light labels
# stay readable over any wallpaper (matugen wallpapers vary).
background {
    monitor =
    path = $wallpaper
    blur_passes = 3            # frosted-glass look
    blur_size = 7
    noise = 0.0117
    contrast = 0.9
    brightness = 0.7           # darken slightly so light labels read
    vibrancy = 0.17
    vibrancy_darkness = 0.05
}

# Clock — centered, large. HH:MM, no seconds.
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $onSurface
    font_size = 90
    font_family = $font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(000000dd)
    position = 0, 110
    halign = center
    valign = center
}

# Date — under the clock, centered.
label {
    monitor =
    text = cmd[update:3600000] echo "$(date +'%A, %d %B %Y')"
    color = $onSurface
    font_size = 22
    font_family = $font
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(000000dd)
    position = 0, 35
    halign = center
    valign = center
}

# Password input — centered, just below the clock/date. Rounding matches windows
# ($windowRounding = 6 in hyprland.conf); frosted inner so the wallpaper shows through.
input-field {
    monitor =
    size = 320, 55
    rounding = 6
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    font_family = $font
    outer_color = $accent
    inner_color = $surfaceA
    font_color = $onSurface
    fade_on_empty = false
    placeholder_text = <span foreground="##$accentHex"><i>󰌾 Logged in as $USER</i></span>
    hide_input = false
    check_color = $accent                       # while verifying
    fail_color = $error                          # wrong password
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>  # e.g. "Wrong (2)"
    capslock_color = $tertiary                   # distinct from accent + fail
    position = 0, -35
    halign = center
    valign = center
}
