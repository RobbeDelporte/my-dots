general {
    lock_cmd = pidof hyprlock || ~/.config/hypr/scripts/lock.sh   # never stack; lock.sh syncs the wallpaper first
    before_sleep_cmd = loginctl lock-session # lock before any sleep
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")' # screen back on after wake
}

# 2.5 min — dim the backlight as an "about to lock" warning.
# `-s` saves the current level before dimming; `-r` restores it on activity.
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 5 min — lock the session.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min — turn the screen off (already locked by now).
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}
