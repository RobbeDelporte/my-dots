# Wallpaper clock position map.
#
# Format:   <wallpaper-filename> = <anchor> [| <x> <y>]
#
# <anchor>  one of:  top left      top center      top right
#                    center left   center          center right
#                    bottom left   bottom center   bottom right
# | <x> <y> optional pixel offset inward from the anchor (e.g. "| 60px 0px").
#
# Anything not listed here uses the default:  center right | 60px 0px
# Lines starting with # are ignored.
#
# Edit by hand, or drag the clock into place with Super+Ctrl+W -- place.sh
# writes the entry here as "top left | <x>px <y>px".

# v2: higher-contrast block needs a calm backdrop; center-right sat on the bright
# planet, so this wallpaper anchors to the clean teal sky instead.
