# foot config — the DEDICATED nvim terminal.
# ~/.config/foot is a manual symlink to this repo dir (see README).
# kitty stays the general-purpose shell terminal (SUPER+T); this one exists so
# nvim can have its own padding/cursor/opacity without compromising either.
# matugen writes the generated colors to ~/my-dots/generated/ (gitignored),
# NOT into this config dir — see the include at the bottom.
#
# Unnamed default section == [main]; it is reopened at the bottom for the
# include, which is the documented way to set a main-section key after a
# [section] header. Validate any edit with `foot --check-config`.

# ── Font ──
# One fontconfig-format list, not kitty's font_family + font_size pair.
font = JetBrains Mono Nerd Font:size=12
# Zoom step, to match kitty's change_font_size 2.0. foot's own default is 0.5.
font-size-adjustment = 2

# ── Window ──
# The whole point of a separate terminal: kitty runs window_padding_width 10,
# which wastes a column of screen either side of a buffer. Near-zero here.
# `center` is ghostty's window-padding-balance: when the compositor forces a
# size that is not a whole number of cells, split the leftover pixels evenly
# instead of anchoring the grid to the top-left corner.
pad = 0x0 center

# No foot equivalent, so deliberately absent rather than forgotten:
#   background-opacity  -> [colors-dark] alpha, set below
#   resize-overlay      -> foot draws no resize popup at all
#   confirm-close       -> foot never asks
#   shell-integration   -> opt-in from the shell side; nothing to switch off

[scrollback]
# Pass the wheel through unscaled: one notch, one event. foot's default is 3.0,
# which is the right dial for a shell terminal scrolling its own scrollback.
# This terminal runs nvim, which grabs the mouse and re-scales every event it
# receives by `mousescroll` (ver:3). Anything above 1 here multiplies with that
# instead of replacing it. So the lines-per-notch dial is `mousescroll` in nvim,
# in one place, and this stays at the hardware's own rate.
multiplier = 1.0

[cursor]
# Block, not kitty's beam: nvim is modal and the block IS the mode indicator.
style = block
blink = no

[mouse]
hide-when-typing = yes

[csd]
# ghostty's window-decoration = none. Only a hint to the compositor, and
# Hyprland draws no titlebar anyway, but it keeps the intent in the config.
preferred = none

[key-bindings]
# Same actions as kitty, on kitty's ctrl+shift triggers. That is muscle-memory
# parity, but it matters twice as much here: foot's defaults put these on bare
# Control+equal / Control+minus / Control+0 and Shift+Page_Up/Down, swallowing
# keys before nvim ever sees them — Control+minus (<C-_>) is the one that hurts.
# Assigning an action REPLACES its entire default combo list, so these lines are
# themselves the unbind; foot needs no equivalent of ghostty's `=unbind` pass.
# Shift is only matched against the UNshifted keysym (Control+Shift+equal, never
# Control+Shift+plus — that combination can never trigger).
font-increase = Control+Shift+equal
font-decrease = Control+Shift+minus
font-reset = Control+Shift+BackSpace
scrollback-up-page = Control+Shift+Page_Up
scrollback-down-page = Control+Shift+Page_Down
# Unbound by default (ghostty grabbed shift+home/end and needed an unbind), so
# these two only add the kitty-parity binding.
scrollback-home = Control+Shift+Home
scrollback-end = Control+Shift+End
# Everything else keeps foot's defaults (Control+Shift+c/v/r/n/o/u, …).

# ── Static fallback palette ──
# Same values as kitty's fallback, so a fresh checkout looks right before the
# first matugen render. Overridden by the include below.
# [colors-dark], not [colors]: foot 1.28 rejects a bare [colors] section, and
# dark is the theme it loads unless initial-color-theme=light. Values are
# 6-digit hex WITHOUT a leading `#`.
[colors-dark]
alpha = 1.0
background = 0b0f11
foreground = dfe6ed
regular0 = 151a1e
regular1 = f28b82
regular2 = 81c995
regular3 = fdd663
regular4 = 8ab4f8
regular5 = cf86e8
regular6 = 78d9ec
regular7 = c4cdd4
bright0 = 3c4a50
bright1 = f6aea9
bright2 = a8d5b5
bright3 = fde78b
bright4 = a8c7fa
bright5 = ddb6f2
bright6 = a4eaf5
bright7 = dfe6ed

# ── matugen-generated colors ──
# Processed in place and last-wins, so it overrides the block above. `~/` is
# expanded (unlike ghostty, which needed the absolute path spelled out).
# A missing file is a config error — foot has no `?`-optional form — but it
# drops only this directive: the error is logged and every setting above still
# applies, which is what keeps the fallback palette above meaningful.
[main]
include = ~/my-dots/generated/foot-colors.ini
